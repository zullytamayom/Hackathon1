<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>landing page interespacial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <section class="slider-intergalactico">
    <div class="container">
        <ul class="slide-list">
            <li class="item" style="background-image: url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1000')">
                <div class="content">
                    <h2 class="title">Nebulosa de Orión</h2>

                    <button class="btn-cart">Agregar al carrito</button>
                </div>
            </li>
            <li class="item" style="background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1000')">

                    <h2 class="title">Anillos de Saturno</h2>
                    <p class="description">Explora los cristales de hielo de los anillos más famosos.</p>
                    <button class="btn-cart">Agregar al carrito</button>
                </div>
            </li>
            <li class="item" style="background-image: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?q=80&w=1000')">
                <div class="content">
                    <h2 class="title">Marte: El Planeta Rojo</h2>
                    <p class="description">Senderismo en el Monte Olimpo, el volcán más grande.</p>
                    <button class="btn-cart">Agregar al carrito</button>
                </div>
            </li>
        </ul>

        <nav class="nav-buttons">
